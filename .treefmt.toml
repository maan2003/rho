# Vendored subtrees keep their upstream formatting (AGENTS.md: they are
# first-class code, but fixes there stay mergeable with upstream).
excludes = ["crates/senax-encoder/*", "vendor/*"]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.rust]
command = "rustfmt"
includes = ["*.rs"]
options = ["--edition", "2024"]

[formatter.toml]
command = "taplo"
includes = ["*.toml"]
options = ["format"]
