[workspace]
resolver = "2"
members = [
  "devenv-nix-backend",
]

[workspace.package]
version = "2.3.2"
edition = "2024"
license = "APACHE-2.0"
homepage = "https://devenv.sh/"
repository = "https://github.com/cachix/devenv/"

[workspace.dependencies]
nix-bindings-flake = { git = "https://github.com/cachix/nix-bindings-rust.git", branch = "2.35" }
nix-bindings-expr = { git = "https://github.com/cachix/nix-bindings-rust.git", branch = "2.35" }
nix-bindings-store = { git = "https://github.com/cachix/nix-bindings-rust.git", branch = "2.35" }
nix-bindings-util = { git = "https://github.com/cachix/nix-bindings-rust.git", branch = "2.35" }
nix-bindings-fetchers = { git = "https://github.com/cachix/nix-bindings-rust.git", branch = "2.35" }
nix-bindings-bindgen-raw = { git = "https://github.com/cachix/nix-bindings-rust.git", branch = "2.35" }
anyhow = "1.0.102"
miette = { version = "7.6.0", features = ["fancy"] }
nix = { version = "0.31", features = [
  "fs",
  "poll",
  "process",
  "resource",
  "signal",
  "term",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
rusqlite = { version = "0.40", features = ["bundled"] }
