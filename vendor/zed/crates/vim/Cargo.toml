[package]
name = "vim"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/vim.rs"
doctest = false

[features]
default = ["zed-workspace"]
neovim = ["nvim-rs", "async-compat", "async-trait", "tokio"]
zed-workspace = [
  "editor/native",
  "dep:command_palette",
  "dep:command_palette_hooks",
  "dep:db",
  "dep:fuzzy",
  "dep:picker",
  "dep:project",
  "dep:search",
  "dep:task",
  "dep:workspace",
]

[dependencies]
anyhow.workspace = true
async-compat = { workspace = true, "optional" = true }
async-trait = { workspace = true, "optional" = true }
collections.workspace = true
command_palette = { workspace = true, optional = true }
command_palette_hooks = { workspace = true, optional = true }
db = { workspace = true, optional = true }
editor = { path = "../editor", default-features = false }
env_logger.workspace = true
futures.workspace = true
fuzzy = { workspace = true, optional = true }
gpui.workspace = true
itertools.workspace = true
language.workspace = true
log.workspace = true
multi_buffer.workspace = true
nvim-rs = { git = "https://github.com/KillTheMule/nvim-rs", rev = "764dd270c642f77f10f3e19d05cc178a6cbe69f3", features = ["use_tokio"], optional = true }
picker = { workspace = true, optional = true }
project = { workspace = true, optional = true }
regex.workspace = true
schemars.workspace = true
search = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
task = { workspace = true, optional = true }
text.workspace = true
theme.workspace = true
theme_settings.workspace = true
menu.workspace = true
tokio = { version = "1.15", features = ["full"], optional = true }
ui.workspace = true
util.workspace = true
util_macros.workspace = true
vim_mode_setting.workspace = true
workspace = { workspace = true, optional = true }
zed_actions.workspace = true

[dev-dependencies]
command_palette = { workspace = true, features = ["test-support"] }
editor = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
indoc.workspace = true
language = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
lsp = { workspace = true, features = ["test-support"] }
parking_lot.workspace = true
release_channel.workspace = true
semver.workspace = true
settings.workspace = true
perf.workspace = true
util = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
search = { workspace = true, features = ["test-support"] }
