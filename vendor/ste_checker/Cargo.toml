[workspace]
members = ["ste_checker"]
resolver = "3"

[workspace.lints.clippy]
doc_lazy_continuation = "allow"
float_cmp = "allow"
get_first = "allow"
get_last_with_len = "allow"
len_zero = "allow"
manual_is_multiple_of = "allow"
tabs_in_doc_comments = "allow"
undocumented_unsafe_blocks = "warn"

[workspace.dependencies]
# exact: the corpus counts in tests/integration are a snapshot of this dictionary and tagger.
harper-brill = "=2.8.0"
harper-core = { version = "=2.8.0", default-features = false }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"
