# Standalone workspace: this crate targets wasm32-unknown-unknown and is
# built with trunk into a static bundle (`webui/dist/`), hostable anywhere.
[workspace]

[package]
name = "rho-webui"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
anyhow = "1"
camino = "1"
console_error_panic_hook = "0.1"
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
hkdf = "0.12"
iroh = { version = "1.0.2", default-features = false, features = ["tls-ring"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
rho-iroh-auth = { path = "../crates/rho-iroh-auth", default-features = false }
rho-core = { path = "../crates/rho-core" }
rho-registry = { path = "../crates/rho-registry" }
rho-ui-proto = { path = "../crates/rho-ui-proto" }
json-stream = { path = "../crates/json-stream" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
zeroize = "1"
web-sys = { version = "0.3", features = [
  "CssStyleDeclaration",
  "Crypto",
  "Document",
  "HtmlTextAreaElement",
  "Location",
  "MediaQueryList",
  "Navigator",
  "Storage",
  "Window",
] }

# Same forks the root workspace patches in: `rho-iroh-auth` uses vendored
# iroh/noq API surface, so this workspace must resolve the same sources.
[patch.crates-io]
noq = { path = "../vendor/noq/noq" }
noq-proto = { path = "../vendor/noq/noq-proto" }
iroh = { path = "../vendor/iroh/iroh" }

[profile.release]
opt-level = "s"
lto = true
