exclude = [".rustfmt.toml"]

[formatting]
# Sorting arrays is safe only where order means nothing: elsewhere
# (rustflags, command lines) it changes what the array says.
reorder_arrays = false
reorder_keys = true

# Cargo.toml: keep the conventional key order inside [package] and
# per-target tables (Cargo's idiomatic order: name, version, edition,
# authors, ...). Sort everything else — dependencies, features, etc.
[[rule]]
formatting.reorder_keys = false
include = ["**/Cargo.toml"]
keys = ["bench", "bin", "example", "lib", "package", "test"]

# Cargo.toml arrays (workspace members, features) are sets: sort them.
[[rule]]
formatting.reorder_arrays = true
include = ["**/Cargo.toml"]
