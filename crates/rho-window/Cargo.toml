# The chrome every screen is drawn with: the style vocabulary, the
# highlights over it, the editor configuration a buffer is opened with,
# and the visualization surface. Owned by the window, used by every source
# crate, naming none of them (`GUI-CRATES-DESIGN.md`).
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-window"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
editor = { path = "../../vendor/zed/crates/editor", default-features = false, features = ["native"] }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = ["wayland"] }
language = { path = "../../vendor/zed/crates/language" }
multi_buffer = { path = "../../vendor/zed/crates/multi_buffer" }
rho-core.workspace = true
rho-hosts = { workspace = true }
text = { path = "../../vendor/zed/crates/text" }
theme = { path = "../../vendor/zed/crates/theme" }
