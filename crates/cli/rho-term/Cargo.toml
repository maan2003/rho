# The ad hoc `rho`: one agent, started here or attached to, in the
# terminal. A client of the agent host on this machine, over its socket.
[package]
edition.workspace = true
license.workspace = true
name = "rho-term"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
camino.workspace = true
clap.workspace = true
json-stream.workspace = true
prefix-id.workspace = true
rand.workspace = true
rho-agent-hosts.workspace = true
rho-agent-types.workspace = true
rho-agents-client = { workspace = true, features = ["client"] }
rho-rpc.workspace = true
rho-term-ui.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
vt100.workspace = true
