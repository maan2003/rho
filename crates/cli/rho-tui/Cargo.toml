# `rho` drawn by the GUI's own screens in a terminal: the agent's
# transcript and prompt are one Zed editor with vim mode, on rho-tty.
# Beside the inline `rho` while it proves itself.
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-tui"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
assets = { path = "../../../vendor/zed/crates/assets" }
camino.workspace = true
clap.workspace = true
editor = { path = "../../../vendor/zed/crates/editor", default-features = false, features = ["native"] }
futures.workspace = true
project = { path = "../../../vendor/zed/crates/project" }
gpui = { path = "../../../vendor/zed/crates/gpui", default-features = false }
language = { path = "../../../vendor/zed/crates/language" }
rand.workspace = true
release_channel = { path = "../../../vendor/zed/crates/release_channel" }
rho-agent-types.workspace = true
rho-agents-client = { workspace = true, features = ["client"] }
rho-agents-view.workspace = true
rho-term = { path = "../rho-term" }
rho-tty = { path = "../rho-tty" }
semver = "1"
settings = { path = "../../../vendor/zed/crates/settings" }
text.workspace = true
theme = { path = "../../../vendor/zed/crates/theme" }
theme_settings = { path = "../../../vendor/zed/crates/theme_settings" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
vim = { path = "../../../vendor/zed/crates/vim", default-features = false }
vim_mode_setting = { path = "../../../vendor/zed/crates/vim_mode_setting" }
