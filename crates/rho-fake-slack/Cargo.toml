# A Slack that is real enough to live in: the web API and websocket surface
# rho uses, over a typed store seeded from one number, with time running in
# it while clients are connected. Library first, binary second; `rho-slack`
# depends on it only for tests, so nothing here can reach the client.
[package]
name = "rho-fake-slack"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
reqwest.workspace = true
# The client, for the one number that is a client's and not the server's:
# what a first full sync costs. Without the surface, so a measurement of the
# protocol does not drag a window in behind it. This is a dev-dependency
# cycle on purpose: `rho-slack` uses this crate for its tests, and this crate
# uses `rho-slack` only for its own.
rho-slack = { workspace = true, default-features = false }
rustls.workspace = true
# The socket, from the client's side: a test connects the way rho does, with
# the request `rho-slack` builds, rather than with a hand-made handshake.
tokio-tungstenite.workspace = true
futures-util.workspace = true
