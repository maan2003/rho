[package]
edition.workspace = true
license.workspace = true
name = "rho-browser"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# Pages as the frame shows them: the `page` system and its surfaces.
ui = [
  "dep:blake3",
  "dep:redb",
  "dep:rho-db",
  "dep:rho-dealer",
  "dep:rho-frame",
  "dep:rho-window",
]

[dependencies]
anyhow.workspace = true
async-channel = "2"
blake3 = { workspace = true, optional = true }
dirs.workspace = true
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = [
  "wayland",
] }
image = { version = "0.25", default-features = false }
libc.workspace = true
redb = { workspace = true, optional = true }
rho-browser-wayland.workspace = true
rho-db = { workspace = true, optional = true }
rho-dealer = { workspace = true, optional = true }
rho-frame = { workspace = true, optional = true }
rho-window = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
smallvec = "1"
theme = { path = "../../vendor/zed/crates/theme" }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
futures-lite = "2"
jiff.workspace = true
rho-ledger = { workspace = true, features = ["client"] }
tempfile.workspace = true
# The fake browser example is a Wayland client: rho's browser compositor
# tears a page down if no top-level window ever binds.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
