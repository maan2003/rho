# The agents as the client holds them: the fold, the disk copy and the host
# session. Without the `client` feature it is the agents protocol alone, for
# the host.
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-agents-client"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
client = [
  "dep:anyhow",
  "dep:collections",
  "dep:futures",
  "dep:prefix-id",
  "dep:redb",
  "dep:rho-db",
  "dep:rho-hosts",
  "dep:tokio",
  "dep:tracing",
]

[dependencies]
bytes.workspace = true
camino.workspace = true
rho-rpc.workspace = true
rho-agent-types.workspace = true
senax-encoder.workspace = true

anyhow = { workspace = true, optional = true }
collections = { path = "../../vendor/zed/crates/collections", optional = true }
futures = { workspace = true, optional = true }
prefix-id = { workspace = true, default-features = false, features = ["redb"], optional = true }
redb = { workspace = true, optional = true }
rho-db = { workspace = true, optional = true }
rho-hosts = { workspace = true, features = ["client"], optional = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# The tests exercise the client too.
rho-agents-client = { path = ".", features = ["client"] }
tempfile = { workspace = true }
rho-hosts = { workspace = true, features = ["test-support"] }
