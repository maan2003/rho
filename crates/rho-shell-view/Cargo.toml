# The comint-style shell surface for a daemon-owned shell: the model that
# projects the daemon's structured executions into a multibuffer, its
# styles, its pager, and the actions that belong to it. rho-shell is the
# kernel; this is the screen.
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-shell-view"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
editor = { path = "../../vendor/zed/crates/editor", default-features = false, features = ["native"] }
futures.workspace = true
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = ["wayland"] }
language = { path = "../../vendor/zed/crates/language" }
multi_buffer = { path = "../../vendor/zed/crates/multi_buffer" }
rho-hosts = { workspace = true }
rho-terminal = { workspace = true }
rho-ui-proto.workspace = true
rho-window = { workspace = true }
text = { path = "../../vendor/zed/crates/text" }
theme = { path = "../../vendor/zed/crates/theme" }
tokio = { workspace = true, features = ["sync"] }
