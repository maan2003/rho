[package]
name = "rho-desktop-proto"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
local = ["dep:anyhow", "dep:tokio"]
senax = ["dep:bytes", "dep:senax-encoder"]

[dependencies]
anyhow = { version = "1", optional = true }
bytes = { version = "1", optional = true }
senax-encoder = { path = "../senax-encoder", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "io-util",
  "net",
  "rt",
  "time",
], optional = true }
