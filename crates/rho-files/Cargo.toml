# The files a host-owned workspace shows: buffers opened over rho's bounded
# file protocol (the agent host owns disk IO, the GUI owns unsaved edits) and the
# diff of a workspace against its base. Owned by no workspace; the window
# shows both. Without the `client` feature it is the protocol alone, for the
# host that serves it.
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-files"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
client = [
  "dep:anyhow",
  "dep:buffer_diff",
  "dep:clock",
  "dep:editor",
  "dep:futures",
  "dep:gpui",
  "dep:language",
  "dep:multi_buffer",
  "dep:path",
  "dep:rho-agent-hosts",
  "rho-rpc/native-client",
  "dep:rho-window",
  "dep:text",
  "dep:theme",
  "dep:tracing",
]

[dependencies]
bytes.workspace = true
camino.workspace = true
rho-rpc.workspace = true
rho-agent-types.workspace = true
senax-encoder.workspace = true

anyhow = { workspace = true, optional = true }
buffer_diff = { workspace = true, optional = true }
clock = { path = "../../vendor/zed/crates/clock", optional = true }
editor = { path = "../../vendor/zed/crates/editor", default-features = false, features = ["native"], optional = true }
futures = { workspace = true, optional = true }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = ["wayland"], optional = true }
language = { path = "../../vendor/zed/crates/language", optional = true }
multi_buffer = { path = "../../vendor/zed/crates/multi_buffer", optional = true }
path = { path = "../../vendor/zed/crates/path", optional = true }
rho-agent-hosts = { workspace = true, features = ["client"], optional = true }
rho-window = { workspace = true, optional = true }
text = { path = "../../vendor/zed/crates/text", optional = true }
theme = { path = "../../vendor/zed/crates/theme", optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# The tests exercise the client too.
rho-files = { path = ".", features = ["client"] }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = [
  "test-support",
] }
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }
