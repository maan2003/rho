# Chat, as the client holds it: the fold of every host's log, the disk copy,
# the outbox and the host session. Without the `client` feature it is the
# chat protocol alone, for the host.
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-chat"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
client = [
  "dep:anyhow",
  "dep:futures",
  "dep:jiff",
  "dep:rand",
  "dep:redb",
  "dep:rho-agent-hosts",
  "dep:rho-db",
  "dep:rho-dealer",
  "dep:tokio",
  "dep:tracing",
]

# The chat as the frame shows it: the system, the thread surface, the
# claims, Home's rows.
ui = [
  "client",
  "dep:editor",
  "dep:gpui",
  "dep:language",
  "dep:multi_buffer",
  "dep:rho-frame",
  "dep:rho-transcript",
  "dep:rho-window",
  "dep:theme",
  "dep:url",
]

[dependencies]
bytes.workspace = true
rho-agent-types.workspace = true
rho-rpc.workspace = true
senax-encoder.workspace = true

anyhow = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
rho-agent-hosts = { workspace = true, features = ["client"], optional = true }
rho-db = { workspace = true, optional = true }
rho-dealer = { workspace = true, optional = true }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "rt",
  "sync",
], optional = true }
tracing = { workspace = true, optional = true }

editor = { path = "../../vendor/zed/crates/editor", default-features = false, features = [
  "native",
], optional = true }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = [
  "wayland",
], optional = true }
language = { path = "../../vendor/zed/crates/language", optional = true }
multi_buffer = { path = "../../vendor/zed/crates/multi_buffer", optional = true }
rho-frame = { workspace = true, optional = true }
rho-transcript = { workspace = true, optional = true }
rho-window = { workspace = true, optional = true }
theme = { path = "../../vendor/zed/crates/theme", optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
rho-chat = { path = ".", features = ["client"] }
tempfile = { workspace = true }
