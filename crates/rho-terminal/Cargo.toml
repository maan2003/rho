# A daemon-owned terminal shown as a surface: the wire display state, the
# input stream, the viewport with its raw and normal modes, and the actions
# and colours that belong to it. Owned by no workspace; the window shows it.
# Without the `client` feature it is the terminal protocol alone, for the
# host and the workset runtime.
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-terminal"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
client = [
  "dep:anyhow",
  "dep:futures",
  "dep:gpui",
  "dep:rho-hosts",
  "dep:settings",
  "dep:theme",
  "dep:theme_settings",
]

[dependencies]
bytes.workspace = true
rho-rpc.workspace = true
senax-encoder.workspace = true

anyhow = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = ["wayland"], optional = true }
rho-hosts = { workspace = true, features = ["client"], optional = true }
settings = { path = "../../vendor/zed/crates/settings", optional = true }
theme = { path = "../../vendor/zed/crates/theme", optional = true }
theme_settings = { path = "../../vendor/zed/crates/theme_settings", optional = true }

[dev-dependencies]
# The tests exercise the client too.
rho-terminal = { path = ".", features = ["client"] }
