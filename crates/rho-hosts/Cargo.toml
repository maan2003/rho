# The machines this client can reach: one connection per attached daemon,
# the handshake, and the events it produces. Holds no agent, desk or window
# state; everything that wants to say something to a machine goes through it.
# Without the `client` feature it is the host protocol alone, for the host.
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-hosts"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
client = [
  "dep:anyhow",
  "dep:futures",
  "dep:iroh",
  "dep:octo-types",
  "dep:redb",
  "dep:rho-db",
  "dep:rho-iroh-auth",
  "dep:tokio",
  "dep:tracing",
  "rho-rpc/native-client",
]
# The event kinds only a test produces. rho-hosts never depends on the
# crates that read its events, so anything a fixture needs of them is
# built by the reader, not carried through here.
test-support = ["client"]

[dependencies]
bytes.workspace = true
camino.workspace = true
rho-rpc.workspace = true
senax-encoder.workspace = true

anyhow = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
octo-types = { workspace = true, optional = true }
redb = { workspace = true, optional = true }
rho-db = { workspace = true, optional = true }
rho-iroh-auth = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# The tests exercise the client too.
rho-hosts = { path = ".", features = ["client"] }
