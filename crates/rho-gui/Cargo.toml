# rho-gui: the one window. The frame (`rho-frame`) and the systems that plug
# into it do the work; this binary lists them, opens the window and owns the
# desktop's view of the app: fonts, themes, settings, the chime, the D-Bus
# name.
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-gui"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rho-gui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
assets = { path = "../../vendor/zed/crates/assets" }
base64.workspace = true
clap = { workspace = true }
dirs = { workspace = true }
editor = { path = "../../vendor/zed/crates/editor", default-features = false, features = [
  "native",
] }
futures.workspace = true
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = [
  "wayland",
] }
gpui_platform = { path = "../../vendor/zed/crates/gpui_platform", default-features = false, features = [
  "font-kit",
  "wayland",
] }
gpui_tokio = { path = "../../vendor/zed/crates/gpui_tokio" }
release_channel = { path = "../../vendor/zed/crates/release_channel" }
rho-agent-hosts = { workspace = true, features = ["client"] }
rho-agents-client = { workspace = true, features = ["client"] }
rho-agents-view.workspace = true
rho-browser = { workspace = true, features = ["ui"] }
rho-chat = { workspace = true, features = ["ui"] }
rho-db = { workspace = true }
rho-frame = { workspace = true }
rho-iroh-auth = { workspace = true }
rho-journal = { workspace = true }
rho-notes = { workspace = true }
rho-profiling = { workspace = true }
rho-window.workspace = true
rodio = { git = "https://github.com/RustAudio/rodio", rev = "3ee9745862279ce1d18db593155016e7ce024aeb", default-features = false, features = [
  "playback",
  # PulseAudio before ALSA: what drv apps and PipeWire desktops offer.
  "pulseaudio",
  "wav",
] }
rust-embed = { version = "8.11", features = ["include-exclude"] }
rustls = { workspace = true }
search = { path = "../../vendor/zed/crates/search" }
semver = { version = "1.0", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
settings = { path = "../../vendor/zed/crates/settings" }
tempfile.workspace = true
theme = { path = "../../vendor/zed/crates/theme" }
theme_settings = { path = "../../vendor/zed/crates/theme_settings" }
tokio = { workspace = true, features = ["rt", "signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
vim = { path = "../../vendor/zed/crates/vim", default-features = false, features = [
  "zed-workspace",
] }
vim_mode_setting = { path = "../../vendor/zed/crates/vim_mode_setting" }
zbus.workspace = true

# unprefixed_malloc routes C-library allocations (freetype, fontconfig,
# drivers) through jemalloc too; profiling stays inert until MALLOC_CONF
# turns it on.
tikv-jemallocator = { version = "0.7", features = [
  "profiling",
  "unprefixed_malloc_on_supported_platforms",
] }

[dev-dependencies]
gpui_wgpu = { path = "../../vendor/zed/crates/gpui_wgpu", features = [
  "test-support",
] }
