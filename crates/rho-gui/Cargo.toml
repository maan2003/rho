[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-gui"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rho-gui"
path = "src/main.rs"
required-features = ["native"]

[features]
default = ["native"]
# Exposes internal entry points for `benches/`.
bench-support = []
native = [
  "dep:clap",
  "dep:command_palette",
  "dep:dirs",
  "dep:fs",
  "dep:gpui_platform",
  "dep:gpui_tokio",
  "dep:iroh",
  "dep:languages",
  "dep:node_runtime",
  "dep:octo-types",
  "dep:project",
  "dep:release_channel",
  "dep:rho-iroh-auth",
  "dep:rho-profiling",
  "dep:rho-browser",
  "dep:rho-rpc",
  "dep:rho-zulip",
  "dep:rodio",
  "dep:rustls",
  "dep:search",
  "dep:semver",
  "dep:tempfile",
  "dep:tracing-subscriber",
  "dep:tokio",
  "dep:util",
  "vim/zed-workspace",
  "editor/native",
  "languages/load-grammars",
  "rho-rpc/native-client",
]

[dependencies]
anyhow.workspace = true
base64.workspace = true
assets = { path = "../../vendor/zed/crates/assets" }
buffer_diff.workspace = true
camino.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }
clap = { workspace = true, optional = true }
clock = { path = "../../vendor/zed/crates/clock" }
collections = { path = "../../vendor/zed/crates/collections" }
command_palette = { path = "../../vendor/zed/crates/command_palette", optional = true }
dirs = { workspace = true, optional = true }
editor = { path = "../../vendor/zed/crates/editor", default-features = false }
fs = { path = "../../vendor/zed/crates/fs", optional = true }
futures.workspace = true
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false }
gpui_platform = { path = "../../vendor/zed/crates/gpui_platform", default-features = false, features = ["font-kit", "wayland"], optional = true }
gpui_tokio = { path = "../../vendor/zed/crates/gpui_tokio", optional = true }
iroh = { workspace = true, optional = true }
json-stream.workspace = true
language = { path = "../../vendor/zed/crates/language" }
languages = { path = "../../vendor/zed/crates/languages", optional = true }
multi_buffer = { path = "../../vendor/zed/crates/multi_buffer" }
node_runtime = { path = "../../vendor/zed/crates/node_runtime", optional = true }
octo-types = { workspace = true, optional = true }
path = { path = "../../vendor/zed/crates/path" }
project = { path = "../../vendor/zed/crates/project", optional = true }
release_channel = { path = "../../vendor/zed/crates/release_channel", optional = true }
rho-core.workspace = true
rho-browser = { workspace = true, optional = true }
rho-iroh-auth = { workspace = true, optional = true }
rho-profiling = { workspace = true, optional = true }
rho-rtc.workspace = true
rho-registry.workspace = true
rho-rpc = { workspace = true, optional = true }
rho-ui-proto.workspace = true
# The Zulip client is native-only: no Zulip server sends CORS headers, so
# the browser build could not reach one.
rho-zulip = { workspace = true, features = ["ui"], optional = true }
rodio = { git = "https://github.com/RustAudio/rodio", rev = "e50e726ddd0292f6ef9de0dda6b90af4ed1fb66a", default-features = false, features = ["playback", "wav"], optional = true }
rust-embed = { version = "8.11", features = ["include-exclude"] }
image = { version = "0.25", default-features = false }
smallvec = "1"
rustc-hash = "2.1.0"
rustls = { workspace = true, optional = true }
search = { path = "../../vendor/zed/crates/search", optional = true }
semver = { version = "1.0", features = ["serde"], optional = true }
serde.workspace = true
serde_json.workspace = true
settings = { path = "../../vendor/zed/crates/settings" }
text = { path = "../../vendor/zed/crates/text" }
theme = { path = "../../vendor/zed/crates/theme" }
theme_settings = { path = "../../vendor/zed/crates/theme_settings" }
tokio = { workspace = true, features = ["io-util", "net", "process", "rt", "signal"], optional = true }
tempfile = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
tree-sitter = "0.26"
tree-sitter-md = { git = "https://github.com/tree-sitter-grammars/tree-sitter-markdown", rev = "9a23c1a96c0513d8fc6520972beedd419a973539" }
org-element = { version = "0.1.0", default-features = false }
ui = { path = "../../vendor/zed/crates/ui" }
util = { path = "../../vendor/zed/crates/util", optional = true }
vim = { path = "../../vendor/zed/crates/vim", default-features = false }
vim_mode_setting = { path = "../../vendor/zed/crates/vim_mode_setting" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = ["wayland"] }
# unprefixed_malloc routes C-library allocations (freetype, fontconfig,
# drivers) through jemalloc too; profiling stays inert until MALLOC_CONF
# turns it on.
tikv-jemallocator = { version = "0.6", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
backtrace = "0.3"
criterion = "0.5"
editor = { path = "../../vendor/zed/crates/editor", features = ["wrap-test-support"] }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = ["test-support"] }
libc = "0.2"

[target.'cfg(target_family = "wasm")'.dependencies]
# Enables the browser entropy backend for the Zed language-model dependency
# graph.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
hkdf = "0.12"
iroh = { workspace = true, features = ["tls-ring"] }
js-sys = "0.3"
n0-future = "0.3"
rho-touch-keyboard = { path = "../rho-touch-keyboard" }
rho-iroh-auth.workspace = true
rho-rpc = { workspace = true, features = ["browser-client"] }
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Crypto", "Location", "MediaQueryList", "Navigator", "Storage", "Window", "console"] }
zeroize = "1"

[[bench]]
name = "desk_sync"
harness = false
required-features = ["bench-support"]
