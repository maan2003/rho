[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-gui"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rho-gui"
path = "src/main.rs"

[features]
# Exposes internal entry points for `benches/`.
bench-support = []

[dependencies]
anyhow.workspace = true
assets = { path = "../../vendor/zed/crates/assets" }
base64.workspace = true
buffer_diff.workspace = true
bytes = { workspace = true }
camino.workspace = true
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
clap = { workspace = true }
clock = { path = "../../vendor/zed/crates/clock" }
collections = { path = "../../vendor/zed/crates/collections" }
command_palette = { path = "../../vendor/zed/crates/command_palette" }
dirs = { workspace = true }
editor = { path = "../../vendor/zed/crates/editor", default-features = false, features = ["native"] }
fs = { path = "../../vendor/zed/crates/fs" }
futures.workspace = true
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = ["wayland"] }
gpui_platform = { path = "../../vendor/zed/crates/gpui_platform", default-features = false, features = [
  "font-kit",
  "wayland",
] }
gpui_tokio = { path = "../../vendor/zed/crates/gpui_tokio" }
iroh = { workspace = true }
json-stream.workspace = true
language = { path = "../../vendor/zed/crates/language" }
languages = { path = "../../vendor/zed/crates/languages", features = ["load-grammars"] }
libc = { version = "0.2" }
multi_buffer = { path = "../../vendor/zed/crates/multi_buffer" }
node_runtime = { path = "../../vendor/zed/crates/node_runtime" }
octo-types = { workspace = true }
path = { path = "../../vendor/zed/crates/path" }
project = { path = "../../vendor/zed/crates/project" }
redb = { workspace = true }
release_channel = { path = "../../vendor/zed/crates/release_channel" }
rho-browser = { workspace = true }
rho-core.workspace = true
rho-db = { workspace = true }
rho-desk.workspace = true
rho-iroh-auth = { workspace = true }
rho-profiling = { workspace = true }
rho-registry.workspace = true
rho-rpc = { workspace = true, features = ["native-client"] }
rho-rtc.workspace = true
rho-ui-proto.workspace = true
rho-slack = { workspace = true, features = ["ui"] }
rho-transcript.workspace = true
image = { version = "0.25", default-features = false }
org-element = { version = "0.1.0", default-features = false }
rho-zulip = { workspace = true, features = ["ui"] }
rodio = { git = "https://github.com/RustAudio/rodio", rev = "e50e726ddd0292f6ef9de0dda6b90af4ed1fb66a", default-features = false, features = [
  "playback",
  "wav",
] }
rust-embed = { version = "8.11", features = ["include-exclude"] }
rustc-hash = "2.1.0"
rustls = { workspace = true }
search = { path = "../../vendor/zed/crates/search" }
semver = { version = "1.0", features = ["serde"] }
senax-encoder = { workspace = true }
serde.workspace = true
serde_json.workspace = true
settings = { path = "../../vendor/zed/crates/settings" }
smallvec = "1"
tempfile = { workspace = true }
text = { path = "../../vendor/zed/crates/text" }
theme = { path = "../../vendor/zed/crates/theme" }
theme_settings = { path = "../../vendor/zed/crates/theme_settings" }
tokio = { workspace = true, features = [
  "io-util",
  "net",
  "process",
  "rt",
  "signal",
] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
] }
tree-sitter = "0.26"
tree-sitter-md = { git = "https://github.com/tree-sitter-grammars/tree-sitter-markdown", rev = "9a23c1a96c0513d8fc6520972beedd419a973539" }
ui = { path = "../../vendor/zed/crates/ui" }
uuid.workspace = true
util = { path = "../../vendor/zed/crates/util" }
vim = { path = "../../vendor/zed/crates/vim", default-features = false, features = ["zed-workspace"] }
vim_mode_setting = { path = "../../vendor/zed/crates/vim_mode_setting" }

# unprefixed_malloc routes C-library allocations (freetype, fontconfig,
# drivers) through jemalloc too; profiling stays inert until MALLOC_CONF
# turns it on.
tikv-jemallocator = { version = "0.6", features = [
  "profiling",
  "unprefixed_malloc_on_supported_platforms",
] }


[dev-dependencies]
backtrace = "0.3"
criterion = "0.5"
editor = { path = "../../vendor/zed/crates/editor", features = [
  "wrap-test-support",
] }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = [
  "test-support",
] }
