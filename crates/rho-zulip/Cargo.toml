# A self-contained Zulip client: wire protocol, client-side model, and the
# GPUI surfaces that display it. The `ui` feature carries the views, so the
# protocol half stays free of Zed dependencies.
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-zulip"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["ui"]
ui = [
  "dep:chrono",
  "dep:editor",
  "dep:gpui",
  "dep:language",
  "dep:multi_buffer",
  "dep:text",
  "dep:theme",
  "dep:ui",
  # The client is native-only: no Zulip server sends CORS headers, so a
  # browser build could not reach one anyway.
  "editor/native",
]

[dependencies]
anyhow.workspace = true
# Already in the workspace lock through Zed; used only for local-time
# message headers.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
dirs.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

editor = { path = "../../vendor/zed/crates/editor", default-features = false, optional = true }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, optional = true }
language = { path = "../../vendor/zed/crates/language", optional = true }
multi_buffer = { path = "../../vendor/zed/crates/multi_buffer", optional = true }
text = { path = "../../vendor/zed/crates/text", optional = true }
theme = { path = "../../vendor/zed/crates/theme", optional = true }
ui = { path = "../../vendor/zed/crates/ui", optional = true }

[dev-dependencies]
tempfile.workspace = true
