# Notes as the frame shows them: the note surface, the list of every note,
# and the palette's rows over them. Notes live in the user's
# ledger, which the frame owns; this crate keeps no state of its own on disk.
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-notes"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
editor = { path = "../../vendor/zed/crates/editor", default-features = false, features = [
  "native",
] }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = [
  "wayland",
] }
language = { path = "../../vendor/zed/crates/language" }
multi_buffer = { path = "../../vendor/zed/crates/multi_buffer" }
rho-mail.workspace = true
rho-dealer.workspace = true
rho-frame.workspace = true
rho-transcript.workspace = true
rho-window.workspace = true
theme = { path = "../../vendor/zed/crates/theme" }
uuid.workspace = true

[dev-dependencies]
jiff.workspace = true
