[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-desk-client"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# Counters a caller's tests read.
test-support = []

[dependencies]
anyhow.workspace = true
bytes = { workspace = true }
camino.workspace = true
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
futures.workspace = true
prefix-id = { workspace = true, features = ["redb"] }
redb = { workspace = true }
rho-agent-types.workspace = true
rho-agent-host-proto.workspace = true
rho-agents-client = { workspace = true, features = ["client"] }
rho-db = { workspace = true }
rho-hosts = { workspace = true }
rho-slack = { workspace = true }
senax-encoder = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
