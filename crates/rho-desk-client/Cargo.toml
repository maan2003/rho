# The desk as the client holds it: the replica of each host, its cache and
# stream. Without the `client` feature it is the desk protocol alone, for
# the host.
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-desk-client"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
client = [
  "dep:anyhow",
  "dep:chrono",
  "dep:futures",
  "dep:prefix-id",
  "dep:redb",
  "dep:rho-agents-client",
  "dep:rho-db",
  "dep:rho-hosts",
  "dep:rho-slack",
  "dep:tokio",
  "dep:tracing",
  "dep:uuid",
]
# Counters a caller's tests read.
test-support = ["client"]

[dependencies]
bytes.workspace = true
camino.workspace = true
clock.workspace = true
rand.workspace = true
rho-agent-types.workspace = true
rho-rpc.workspace = true
senax-encoder.workspace = true
text.workspace = true

anyhow = { workspace = true, optional = true }
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
], optional = true }
futures = { workspace = true, optional = true }
prefix-id = { workspace = true, features = ["redb"], optional = true }
redb = { workspace = true, optional = true }
rho-agents-client = { workspace = true, features = ["client"], optional = true }
rho-db = { workspace = true, optional = true }
rho-hosts = { workspace = true, features = ["client"], optional = true }
rho-slack = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync"], optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# The tests exercise the client too.
rho-desk-client = { path = ".", features = ["client"] }
