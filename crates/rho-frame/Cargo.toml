# The frame: the one window, its history of surfaces, the minibuffer, the
# menus, the keymap, the attached hosts and the ledger. Systems plug in
# surfaces, menu rows, cards, channels and things to find, each under one
# address scheme; the frame knows none of them by name.
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-frame"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
collections = { path = "../../vendor/zed/crates/collections" }
editor = { path = "../../vendor/zed/crates/editor", default-features = false, features = [
  "native",
] }
futures.workspace = true
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = [
  "wayland",
] }
gpui_tokio = { path = "../../vendor/zed/crates/gpui_tokio" }
jiff.workspace = true
language = { path = "../../vendor/zed/crates/language" }
memchr = "2"
multi_buffer = { path = "../../vendor/zed/crates/multi_buffer" }
redb.workspace = true
rho-agent-hosts = { workspace = true, features = ["client"] }
rho-agent-types.workspace = true
rho-db.workspace = true
rho-dealer.workspace = true
rho-journal.workspace = true
rho-ledger = { workspace = true, features = ["client"] }
rho-transcript.workspace = true
rho-window.workspace = true
senax-encoder.workspace = true
settings = { path = "../../vendor/zed/crates/settings" }
sum_tree = { path = "../../vendor/zed/crates/sum_tree" }
text = { path = "../../vendor/zed/crates/text" }
theme = { path = "../../vendor/zed/crates/theme" }
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
vim = { path = "../../vendor/zed/crates/vim", default-features = false, features = [
  "zed-workspace",
] }
vim_mode_setting = { path = "../../vendor/zed/crates/vim_mode_setting" }

[dev-dependencies]
assets = { path = "../../vendor/zed/crates/assets" }
criterion = "0.8.2"
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = [
  "test-support",
] }
release_channel = { path = "../../vendor/zed/crates/release_channel" }
semver = "1"
settings = { path = "../../vendor/zed/crates/settings", features = [
  "test-support",
] }
theme_settings = { path = "../../vendor/zed/crates/theme_settings" }
