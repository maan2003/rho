# What the client knows about agents: their transcripts, the map of them
# and the screens that show them. Cut out of `rho-gui` one piece at a
# time (`GUI-CRATES-DESIGN.md`); the transcript came first.
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-agents"
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
bytes.workspace = true
camino.workspace = true
collections = { path = "../../vendor/zed/crates/collections" }
editor = { path = "../../vendor/zed/crates/editor", default-features = false, features = ["native"] }
futures.workspace = true
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = ["wayland"] }
json-stream.workspace = true
language = { path = "../../vendor/zed/crates/language" }
multi_buffer = { path = "../../vendor/zed/crates/multi_buffer" }
prefix-id = { workspace = true, default-features = false }
rho-core.workspace = true
rho-hosts = { workspace = true }
rho-ui-proto.workspace = true
rho-window = { workspace = true }
rustc-hash = "2.1.0"
senax-encoder.workspace = true
settings = { path = "../../vendor/zed/crates/settings" }
serde_json.workspace = true
text = { path = "../../vendor/zed/crates/text" }
theme = { path = "../../vendor/zed/crates/theme" }
theme_settings = { path = "../../vendor/zed/crates/theme_settings" }
tree-sitter = "0.26"
tree-sitter-md = { git = "https://github.com/tree-sitter-grammars/tree-sitter-markdown", rev = "9a23c1a96c0513d8fc6520972beedd419a973539" }
ui = { path = "../../vendor/zed/crates/ui" }

[dev-dependencies]
rho-hosts = { workspace = true, features = ["test-support"] }
