# The host's desktops as a client sees them. Without the `client` feature it
# is the desktops protocol alone, for the host and the workset runtime.
[package]
edition.workspace = true
license = "GPL-3.0-or-later"
name = "rho-desktop-client"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
client = [
  "dep:anyhow",
  "dep:futures",
  "dep:iroh",
  "dep:moq-net",
  "dep:rho-desktop-media",
  "dep:rho-desktop-proto",
  "dep:rho-agent-hosts",
  "dep:tokio",
  "dep:tracing",
]

# The desktops as the frame shows them: the surface over the live view of
# one, and its keys.
ui = [
  "client",
  "dep:gpui",
  "dep:image",
  "dep:rho-frame",
  "dep:theme",
]

[dependencies]
bytes.workspace = true
rho-rpc.workspace = true
senax-encoder.workspace = true

anyhow = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = ["wayland"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
iroh = { workspace = true, optional = true }
moq-net = { workspace = true, optional = true }
rho-desktop-media = { workspace = true, features = ["decoder", "iroh"], optional = true }
rho-desktop-proto = { workspace = true, optional = true }
rho-agent-hosts = { workspace = true, features = ["client"], optional = true }
rho-frame = { workspace = true, optional = true }
theme = { path = "../../vendor/zed/crates/theme", optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# The tests exercise the client too.
rho-desktop-client = { path = ".", features = ["ui"] }
gpui = { path = "../../vendor/zed/crates/gpui", default-features = false, features = [
  "test-support",
] }

rho-desktop-media = { workspace = true, features = ["encoder"] }

tokio = { workspace = true, features = ["test-util"] }
