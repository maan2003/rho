[profile.ci]
debug = "line-tables-only"
incremental = false
inherits = "dev"
lto = "off"

# Thin LTO trims the enormous monomorphized .text sections (the six release
# binaries total over 400MB without it) at a modest link-time cost.
# Opening a real database in a dev build otherwise takes minutes: redb's
# debug assertions walk every page on each open, and a repair verifies
# checksums over the whole file, which is slow unoptimized.
[profile.dev.package.redb]
opt-level = 3
debug-assertions = false

[profile.release]
debug = "line-tables-only"
lto = "thin"

[profile.profiling]
debug = "line-tables-only"
inherits = "release"

[patch.crates-io]
# Local noq fork: adds per-send-stream weights to fair scheduling while
# preserving noq's strict priority classes. Keep both crates patched because
# `noq` exposes the API and `noq-proto` owns the packet scheduler.
iroh = { path = "vendor/iroh/iroh" }
noq = { path = "vendor/noq/noq" }
noq-proto = { path = "vendor/noq/noq-proto" }
# Local redb fork: compaction keeps relocating pages past one it cannot
# move lower, instead of stopping at the first such page.
redb = { path = "vendor/redb" }
# Upstream fixes for ambiguities in the derive's expansion: integer comparison,
# exposed by alacritty_terminal's `impl PartialOrd<Column> for usize`, and
# `as_ref` on a single field's bytes, exposed by the GUI crates' `AsRef` impls.
# Later revisions change the TypeName of structs with user-defined fields.
redb-derive = { git = "https://github.com/cberner/redb", rev = "f551b96f43d36314db076ad38a49c8eb6e8ee311" }
tree-sitter-language = { path = "vendor/tree-sitter-language" }

# Share MoQ model primitives with its Iroh transport.
kio = { path = "vendor/moq/rs/kio" }
