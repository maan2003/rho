[workspace]
members = [
  "crates/json-stream",
  "crates/octo-cli",
  "crates/octo-server",
  "crates/octo-types",
  "crates/prefix-id",
  "crates/rho-agent",
  "crates/rho-agent2",
  "crates/rho-ci",
  "crates/rho-claude",
  "crates/rho-claude-usage",
  "crates/rho-cli",
  "crates/rho-code-mode",
  "crates/rho-context-config",
  "crates/rho-core",
  "crates/rho-daemon",
  "crates/rho-db",
  "crates/rho-shell",
  "crates/rho-shell-proto",
  "crates/rho-gui",
  "crates/rho-browser-wayland",
  "crates/rho-touch-keyboard",
  "crates/rho-inference",
  "crates/rho-image",
  "crates/rho-iroh-auth",
  "crates/rho-pr-monitor",
  "crates/rho-profiling",
  "crates/rho-rpc",
  "crates/rho-openai-realtime",
  "crates/rho-rtc",
  "crates/rho-registry",
  "crates/rho-tool-shell",
  "crates/rho-ui-proto",
  "crates/rho-visualizations",
  "crates/rho-browser",
  "crates/rho-web-search",
  "crates/rho-workspaces",
  "crates/rho-workspaces-types",
  "crates/rho-zulip",
  "crates/senax-encoder",
  "crates/senax-encoder/derive",
]
# The GPUI browser client is its own workspace: it targets wasm32 and is built
# with Trunk.
exclude = [
  "crates/rho-gui-web",
  "vendor/brush",
  "vendor/jj",
  "vendor/noq",
  "vendor/zed",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/maan2003/rho"
rust-version = "1.89"
version = "0.1.0"

[workspace.dependencies]
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
brush-builtins = { path = "vendor/brush/brush-builtins" }
brush-core = { path = "vendor/brush/brush-core" }
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
bytes = "1"
buffer_diff = { path = "vendor/zed/crates/buffer_diff" }
camino = "1"
clock = { path = "vendor/zed/crates/clock" }
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
deno_core = "0.407"
deno_error = "0.7"
dirs = { version = "6", default-features = false }
fnv = "1"
futures = "0.3"
futures-util = "0.3"
imara-diff = "0.2.0"
iroh = { version = "1.0.2", default-features = false }
json-stream = { path = "crates/json-stream" }
jj-lib = { path = "vendor/jj/lib" }
jj-cli = { path = "vendor/jj/cli" }
libwebrtc = { git = "https://github.com/zed-industries/livekit-rust-sdks", rev = "d0e27be0cdad89eadab3e36207cda0a2b6e359ee" }
libc = "0.2"
notify = "9.0.0-rc.4"
noq-proto = { version = "=1.0.1", default-features = false }
octo-server = { path = "crates/octo-server" }
octo-types = { path = "crates/octo-types" }
pprof = { path = "crates/pprof", default-features = false }
prefix-id = { path = "crates/prefix-id", default-features = false }
rand = "0.8"
rpassword = "7"
redb = "4.1.0"
redb-derive = "0.1.0"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls-native-roots-no-provider",
  "stream",
] }
rho-agent = { path = "crates/rho-agent", default-features = false }
rho-browser-wayland = { path = "crates/rho-browser-wayland" }
rho-ci = { path = "crates/rho-ci" }
rho-claude = { path = "crates/rho-claude" }
rho-claude-usage = { path = "crates/rho-claude-usage" }
rho-cli = { path = "crates/rho-cli" }
rho-code-mode = { path = "crates/rho-code-mode" }
rho-context-config = { path = "crates/rho-context-config" }
rho-core = { path = "crates/rho-core" }
rho-daemon = { path = "crates/rho-daemon" }
rho-db = { path = "crates/rho-db" }
rho-shell-proto = { path = "crates/rho-shell-proto" }
rho-inference = { path = "crates/rho-inference" }
rho-image = { path = "crates/rho-image" }
rho-openai-realtime = { path = "crates/rho-openai-realtime" }
rho-rtc = { path = "crates/rho-rtc" }
rho-registry = { path = "crates/rho-registry" }
rho-iroh-auth = { path = "crates/rho-iroh-auth", default-features = false }
rho-pr-monitor = { path = "crates/rho-pr-monitor" }
rho-profiling = { path = "crates/rho-profiling" }
rho-rpc = { path = "crates/rho-rpc", default-features = false }
rho-shell = { path = "crates/rho-shell" }
rho-tool-shell = { path = "crates/rho-tool-shell" }
rho-ui-proto = { path = "crates/rho-ui-proto" }
rho-visualizations = { path = "crates/rho-visualizations" }
rho-browser = { path = "crates/rho-browser" }
rho-web-search = { path = "crates/rho-web-search" }
rho-workspaces = { path = "crates/rho-workspaces" }
rho-workspaces-types = { path = "crates/rho-workspaces-types" }
rho-zulip = { path = "crates/rho-zulip", default-features = false }
rustix-openpty = "0.2"
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
  "std",
  "tls12",
] }
schemars = "0.8.22"
senax-encoder = { path = "crates/senax-encoder" }
senax-encoder-derive = { path = "crates/senax-encoder/derive" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = { version = "3", default-features = false }
text = { path = "vendor/zed/crates/text" }
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-native-roots",
] }
tracing = { version = "0.1", default-features = false, features = [
  "attributes",
  "std",
] }
url = { version = "2", default-features = false }
uuid = { version = "1", features = ["serde", "v4"] }
worktree = { path = "vendor/zed/crates/worktree" }
zip = { version = "2", default-features = false, features = [
  "deflate",
  "time",
] }
[profile.ci]
debug = "line-tables-only"
incremental = false
inherits = "dev"
lto = "off"

# Thin LTO trims the enormous monomorphized .text sections (the six release
# binaries total over 400MB without it) at a modest link-time cost.
[profile.release]
lto = "thin"

[profile.profiling]
debug = "line-tables-only"
inherits = "release"

[patch.crates-io]
# Local noq fork: adds per-send-stream weights to fair scheduling while
# preserving noq's strict priority classes. Keep both crates patched because
# `noq` exposes the API and `noq-proto` owns the packet scheduler.
noq = { path = "vendor/noq/noq" }
noq-proto = { path = "vendor/noq/noq-proto" }
iroh = { path = "vendor/iroh/iroh" }
# On wasm32-unknown-unknown this crate supplies libc (malloc et al.) for the
# tree-sitter runtime and grammars. Upstream's wasm malloc is a bump allocator
# for isolated scanner instances that corrupts linear memory when linked into a
# binary sharing its heap with Rust; our fork forwards to Rust's allocator.
tree-sitter-language = { path = "vendor/tree-sitter-language" }
