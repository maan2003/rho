  "agent-host/rho-context-config",
  "agent-host/rho-agent-host",
  "crates/rho-desktop-proto",
  "crates/rho-desktop-media",
  "crates/rho-db",
  "agent-host/rho-fake-model",
  "crates/rho-fake-slack",
  "crates/rho-files",
  "agent-host/rho-git",
  "crates/rho-gui",
  "crates/rho-agent-hosts",
  "agent-host/rho-image",
  "agent-host/rho-inference",
  "crates/rho-iroh-auth",
  "crates/rho-journal",
  "crates/rho-desk-client",
  "crates/rho-desktop-client",
  "agent-host/rho-desk-server",
  "agent-host/rho-openai-realtime",
  "agent-host/rho-pr-monitor",
  "crates/rho-profiling",
  "crates/rho-qa",
  "crates/rho-rpc",
  "crates/rho-rtc",
  "agent-host/rho-shell",
  "crates/rho-terminal",
  "crates/rho-shell-view",
  "crates/rho-slack",
