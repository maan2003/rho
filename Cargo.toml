tempfile = { version = "3", default-features = false }
text = { path = "vendor/zed/crates/text" }
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
