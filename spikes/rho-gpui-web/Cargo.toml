[workspace]

[package]
name = "rho-gpui-web-spike"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[[bin]]
name = "rho-gpui-web-spike"
path = "main.rs"

[dependencies]
assets = { path = "../../vendor/zed/crates/assets" }
editor = { path = "../../vendor/zed/crates/editor", default-features = false }
gpui = { path = "../../vendor/zed/crates/gpui" }
gpui_platform = { path = "../../vendor/zed/crates/gpui_platform" }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
rho-core = { path = "../../crates/rho-core" }
rho-registry = { path = "../../crates/rho-registry" }
rho-ui-proto = { path = "../../crates/rho-ui-proto" }
settings = { path = "../../vendor/zed/crates/settings" }
theme = { path = "../../vendor/zed/crates/theme" }
theme_settings = { path = "../../vendor/zed/crates/theme_settings" }
zed_actions = { path = "../../vendor/zed/crates/zed_actions" }

[profile.release]
opt-level = "s"
lto = true

[patch.crates-io]
iroh = { path = "../../vendor/iroh/iroh" }
noq = { path = "../../vendor/noq/noq" }
noq-proto = { path = "../../vendor/noq/noq-proto" }
